
name: Reencontra - Security CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Verificar credenciais expostas
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Executar Gitleaks
        uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  semgrep:
    name: Analisar seguranca do codigo
    runs-on: ubuntu-latest

    container:
      image: semgrep/semgrep:latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Executar Semgrep
        run: semgrep scan --config auto --error .
